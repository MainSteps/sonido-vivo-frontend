<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Contacto - Sonido Vivo</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <header>
            <h1>Sonido Vivo</h1>
            <p>Tienda de instrumentos y equipos musicales</p>
        </header>

        <nav>
            <a href="registro.html">Registro</a> |
            <a href="inicio-sesion.html">Iniciar sesión</a> |
            <a href="contacto.html">Contacto</a>
        </nav>

        <main>
            <section>
                <h2>Contacto</h2>
                <p>Escríbenos si tienes una consulta sobre instrumentos o equipos musicales.</p>
                <div>
                    <label for="input-nombre-contacto">Nombre</label><br>
                    <input id="input-nombre-contacto" type="text" placeholder="Ingrese su nombre" />
                </div>
                <div>
                    <label for="input-email-contacto">Correo electrónico</label><br>
                    <input id="input-email-contacto" type="email" placeholder="Ingrese su correo electrónico" />
                </div>
                <div>
                    <label for="input-comentario">Comentario</label><br>
                    <textarea id="input-comentario" rows="5" placeholder="Escriba su consulta sobre Sonido Vivo"></textarea>
                </div>
                <button id="btn-contacto">Enviar consulta</button>
            </section>
        </main>

        <footer>
            <p>Diego, Matías y Michel - 2026</p>
        </footer>
        <script src="assets/js/contacto.js"></script>
    </body>
</html>
