<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Iniciar sesión - Sonido Vivo</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <!-- Encabezado del sitio -->
        <header>
            <h1>Sonido Vivo</h1>
            <p>Tienda de instrumentos y equipos musicales</p>
        </header>

        <nav>
            <a href="registro.html">Registro</a> |
            <a href="inicio-sesion.html">Iniciar sesión</a> |
            <a href="contacto.html">Contacto</a>
        </nav>

        <!-- Contenido principal de la página -->
        <main>
            <section>
                <h2>Iniciar sesión</h2>
                <p>Ingresa con datos de prueba para acceder a la demostración.</p>
                <form>
                    <div>
                        <label for="input-email-login">Correo electrónico</label><br>
                        <input id="input-email-login" type="email" maxlength="100" placeholder="Ingrese su correo electrónico" />
                        <p id="mensaje-email-login"></p>
                    </div>
                    <div>
                        <label for="input-password-login">Contraseña</label><br>
                        <input id="input-password-login" type="password" minlength="4" maxlength="10" placeholder="Ingrese una contraseña de prueba" />
                    </div>
                    <button id="btn-inicio-sesion" type="button">Iniciar sesión</button>
                </form>
            </section>
        </main>

        <!-- Pie de página -->
        <footer>
            <p>Diego, Matías y Michel - 2026</p>
        </footer>
        <script src="assets/js/inicio-sesion.js"></script>
    </body>
</html>
