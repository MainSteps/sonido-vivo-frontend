<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Registro - Sonido Vivo</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <!-- Encabezado del sitio -->
        <header>
            <h1>Sonido Vivo</h1>
            <p>Tienda de instrumentos y equipos musicales</p>
        </header>

        <!-- Contenido principal de la página -->
        <main>
            <section>
                <h2>Registro de usuario</h2>
                <p>En esta sección se agregará el formulario de registro.</p>
                <!-- Campo de texto basado en el ejemplo de la Clase 1 -->
                <div>
                    <label for="input-run">RUN (sin puntos ni guion)</label><br>
                    <input id="input-run" type="text" placeholder="Ingrese un RUN de prueba" />
                </div>
                <div>
                    <label for="input-nombre">Nombre</label><br>
                    <input id="input-nombre" type="text" />
                </div>
                <div>
                    <label for="input-apellidos">Apellidos</label><br>
                    <input id="input-apellidos" type="text" />
                </div>
                <div>
                    <label for="input-email">Correo electrónico</label><br>
                    <input id="input-email" type="email" placeholder="Ingrese su correo electrónico" />
                </div>
                <div>
                    <label for="input-password">Contraseña</label><br>
                    <input id="input-password" type="password" placeholder="Ingrese una contraseña de prueba" />
                </div>
                <div>
                    <label for="input-fecha-nacimiento">Fecha de nacimiento (opcional)</label><br>
                    <input id="input-fecha-nacimiento" type="date" />
                </div>
                <div>
                    <label for="input-direccion">Dirección</label><br>
                    <input id="input-direccion" type="text" placeholder="Ingrese una dirección de prueba" />
                </div>
                <!-- Botón conectado al archivo JavaScript de registro -->
                <button id="btn-registro">Registrarse</button>
            </section>
        </main>

        <!-- Pie de página -->
        <footer>
            <p>Diego, Matías y Michel - 2026</p>
        </footer>
        <script src="assets/js/registro.js"></script>
    </body>
</html>
