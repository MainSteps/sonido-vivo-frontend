<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Registro - Sonido Vivo</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <!-- Encabezado del sitio -->
        <header>
            <h1>Sonido Vivo</h1>
            <p>Tienda de instrumentos y equipos musicales</p>
        </header>

        <nav>
            <a href="registro.html">Registro</a> |
            <a href="inicio-sesion.html">Iniciar sesión</a> |
            <a href="contacto.html">Contacto</a>
        </nav>

        <!-- Contenido principal de la página -->
        <main>
            <section>
                <h2>Registro de usuario</h2>
                <p>Completa el formulario con datos de prueba.</p>
                <!-- Formulario de registro con datos simulados -->
                <form>
                    <div>
                        <label for="input-run">RUN (sin puntos ni guion)</label><br>
                        <input id="input-run" type="text" minlength="7" maxlength="9" placeholder="Ingrese un RUN de prueba" />
                        <p id="mensaje-run"></p>
                    </div>
                    <div>
                        <label for="input-nombre">Nombre</label><br>
                        <input id="input-nombre" type="text" maxlength="50" />
                    </div>
                    <div>
                        <label for="input-apellidos">Apellidos</label><br>
                        <input id="input-apellidos" type="text" maxlength="100" />
                    </div>
                    <div>
                        <label for="input-email">Correo electrónico</label><br>
                        <input id="input-email" type="email" maxlength="100" placeholder="Ingrese su correo electrónico" />
                    </div>
                    <div>
                        <label for="input-password">Contraseña</label><br>
                        <input id="input-password" type="password" minlength="4" maxlength="10" placeholder="Ingrese una contraseña de prueba" />
                    </div>
                    <div>
                        <label for="input-fecha-nacimiento">Fecha de nacimiento (opcional)</label><br>
                        <input id="input-fecha-nacimiento" type="date" />
                    </div>
                    <div>
                        <label for="input-region">Región</label><br>
                        <select id="input-region">
                            <option value="">Seleccione una región</option>
                        </select>
                    </div>
                    <div>
                        <label for="input-comuna">Comuna</label><br>
                        <select id="input-comuna">
                            <option value="">Seleccione primero una región</option>
                        </select>
                    </div>
                    <div>
                        <label for="input-direccion">Dirección</label><br>
                        <input id="input-direccion" type="text" maxlength="300" placeholder="Ingrese una dirección de prueba" />
                    </div>
                    <!-- Botón conectado al archivo JavaScript de registro -->
                    <button id="btn-registro" type="button">Registrarse</button>
                </form>
            </section>
        </main>

        <!-- Pie de página -->
        <footer>
            <p>Diego, Matías y Michel - 2026</p>
        </footer>
        <script src="assets/js/data/regiones-comunas.js"></script>
        <script src="assets/js/registro.js"></script>
    </body>
</html>
