<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonido Vivo | Mantenedor de productos</title>
    <link rel="stylesheet" href="../assets/css/catalogo.css">
</head>
<body>
    <main>
        <section>
            <h1>Mantenedor de productos</h1>
            <p>Crea, edita y elimina productos simulados.</p>

            <form id="formulario-producto" novalidate>
                <div>
                    <label for="codigo">Código</label>
                    <input
                        id="codigo"
                        name="codigo"
                        type="text"
                        minlength="3"
                        required
                    >
                    <small id="error-codigo"></small>
                </div>

                <div>
                    <label for="nombre">Nombre</label>
                    <input
                        id="nombre"
                        name="nombre"
                        type="text"
                        maxlength="100"
                        required
                    >
                    <small id="error-nombre"></small>
                </div>

                <div>
                    <label for="precio">Precio</label>
                    <input
                        id="precio"
                        name="precio"
                        type="number"
                        min="0"
                        step="0.01"
                        required
                    >
                    <small id="error-precio"></small>
                </div>

                <div>
                    <label for="stock">Stock</label>
                    <input
                        id="stock"
                        name="stock"
                        type="number"
                        min="0"
                        step="1"
                        required
                    >
                    <small id="error-stock"></small>
                </div>

                <div>
                    <label for="categoria">Categoría</label>
                    <select id="categoria" name="categoria" required>
                        <option value="">Selecciona una categoría</option>
                        <option value="Guitarras">Guitarras</option>
                        <option value="Bajos">Bajos</option>
                        <option value="Teclados">Teclados</option>
                        <option value="Audio">Audio</option>
                        <option value="Accesorios">Accesorios</option>
                    </select>
                    <small id="error-categoria"></small>
                </div>

                <button type="submit">Guardar producto</button>
                <button type="button" id="cancelar-edicion" hidden>
                    Cancelar edición
                </button>
            </form>
        </section>

        <section>
            <h2>Productos registrados</h2>

            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="lista-admin-productos"></tbody>
            </table>
        </section>
    </main>

    <script type="module" src="../assets/js/admin-productos.js"></script>
</body>
</html>
